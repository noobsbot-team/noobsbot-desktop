# Noobsbot Desktop settings. Saving this file applies the changes instantly.
# Every value below is the default; delete a line to go back to it.
# A line the desktop doesn't understand is reported in the journal and skipped:
#   journalctl --user -t noobsbot-desktop

version = 1

# Terminal opened by Super+Enter and the "terminal" action.
terminal = "noobsbot"

# Look for a new Noobsbot Desktop release once a day (sends nothing but the version). Applies at next login.
check_updates = true

[appearance]
# "light", "dark" or "auto" (dark from dark_from until dark_until, in whole hours of local time).
mode = "light"
dark_from = 19
dark_until = 7
# auto: dark from sunset to sunrise at the [weather] city or coordinates instead (the hours above without one).
auto_sunset = false
# blue, purple, pink, red, orange, yellow, green or graphite.
accent = "blue"
# Multiplies the opacity of every glass surface (0.0 … 1.0).
glass_opacity = 1.0
# Wallpaper picture (PNG or JPEG), placed by wallpaper_fit; empty = the built-in opal gradient.
wallpaper = ""
# Used in dark mode; empty = the built-in dark opal gradient.
wallpaper_dark = ""
# "fill" (cover the screen), "fit" (the whole picture), "centre" (its own size), "stretch" or "tile" (repeated).
wallpaper_fit = "fill"
# More folders of pictures for Settings' wallpaper gallery ("+ Add Folder…"), separated by ":".
gallery_folders = ""
# Slideshow: a folder of PNG/JPEG pictures shown in turn, in light and dark mode; empty = off.
wallpaper_folder = ""
# Minutes per picture; 0 = a new one only at each login (pair with shuffle).
wallpaper_interval = 30
# Random order instead of by file name.
wallpaper_shuffle = false
# The Dark Mode toggle also rewrites the Noobsbot Glass theme for Qt apps (Kvantum, colour scheme, kdeglobals),
# like `noobsbot-desktop theme --write`. Off by default: it edits files in ~/.config and ~/.local/share.
theme_apps = false
# Reduce motion: windows, menus and banners crossfade (150 ms) instead of moving.
reduce_motion = false
# Text size of menus, the menu bar, the dock and notifications (0.8 … 1.5); GTK and Qt apps follow.
text_scale = 1.0
# Pointer size in px, e.g. 24, 32, 48 (0 = $XCURSOR_SIZE, else 24); apps started here get it as XCURSOR_SIZE.
pointer_size = 0

[night_light]
# Warms the screen on a schedule, fading over a minute. Screenshots and screen sharing stay true to colour.
enabled = false
# Kelvin: 6500 = no change, 2700 = warm lamp light (1000 … 6500).
temperature = 3400
# "custom" (from … until, whole hours of local time) or "sunset" (sunset to sunrise at the [weather] place).
schedule = "custom"
from = 19
until = 7

[accessibility]
# Zoom (Super+Alt+8 on/off, Super+Alt+= / Super+Alt+- in and out, 1x … 16x): "full" magnifies the whole screen
# following the pointer, "lens" a window around the pointer.
zoom_style = "full"
# Zoom also follows the text cursor as you type, and the window keyboard focus moves to.
zoom_follows_focus = true
# The whole screen through a filter: "none", "invert", "invert-hue" (light and dark swap, colours keep their hue) or
# "greyscale". Screenshots and screen sharing stay true to colour.
colour_filter = "none"
# Glass panels, menus and buttons near-opaque, with a visible 1 px border.
increase_contrast = false
# Sticky keys: a tapped modifier (Shift, Ctrl, Alt, Super) holds for the next key; tap it twice to keep it until the
# next tap.
sticky_keys = false
# Pressing Shift five times in a row turns sticky keys on or off.
sticky_keys_shortcut = false
# Slow keys: a key counts only once held this many ms; 0 = off.
slow_keys_ms = 0
# Bounce keys: a key pressed again within this many ms of letting it go is ignored; 0 = off.
bounce_keys_ms = 0
# Mouse keys: the keypad moves the pointer (1–9), clicks (5), holds the button (0), lets it go (.) and right-clicks (*).
mouse_keys = false
# An app's bell: "sound" (the theme's bell), "flash" (the screen flashes), "both" or "off".
bell = "sound"
# The on-screen keyboard always shows at the bottom of the screen (the "on-screen-keyboard" action and the input
# menu show it for a while). A click types the key; Shift, Ctrl, Alt and Super stay down for the next key.
on_screen_keyboard = false
# Shake the pointer quickly to make it big for a moment.
shake_to_find = true
# Rest the pointer this many ms to click (a ring shrinks around it meanwhile); 0 = off.
dwell_click_ms = 0
# Hold the primary button still this many ms to get a secondary (right) click instead; 0 = off.
hold_secondary_ms = 0
# The Orca screen reader runs while this is on; Super+Alt+F5 toggles it.
screen_reader = false

[keyboard]
# xkb layout(s), variant(s) and options; empty = the system's (localectl).
# Example: layout = "us,np"  options = "grp:alt_shift_toggle,caps:escape"
layout = ""
variant = ""
options = ""
# Key repeat: held this many ms, then this many times a second (0 = no repeat).
repeat_delay = 500
repeat_rate = 30

[touchpad]
# Off: the trackpad does nothing. The touchpad-toggle key flips this until the file is next saved.
enabled = true
tap_to_click = true
natural_scroll = true
# 3-finger swipes switch Spaces (left/right), open Mission Control (up) and App Exposé (down); 4 = use 4 fingers
# instead, leaving 3-finger swipes to apps. A 4-finger pinch opens Launchpad.
swipe_fingers = 3
# Higher = a shorter swipe or pinch is enough (0.25 … 4).
gesture_sensitivity = 1.0
# Tracking speed, -1 (slow) … 1 (fast).
speed = 0.0
# Right-click: "two-fingers" (click with two fingers), "corner" (click the bottom-right corner) or "off" (every
# physical click is a left click).
secondary_click = "two-fingers"
# Scrolling: "two-fingers", "edge" (one finger along the right or bottom edge) or "none".
scroll_method = "two-fingers"
# Each system gesture on or off: swipe between Spaces, swipe up for Mission Control, down for App Exposé, pinch for
# Launchpad, spread to show the desktop.
gesture_spaces = true
gesture_mission_control = true
gesture_app_expose = true
gesture_launchpad = true
gesture_show_desktop = true
# Tap, then drag with the finger down; drag_lock keeps the drag going through a short lift.
tap_to_drag = true
drag_lock = false
disable_while_typing = true
# Turn the trackpad off while a mouse is plugged in.
ignore_with_mouse = false

[mouse]
# Tracking speed, -1 (slow) … 1 (fast); acceleration off = flat (movement maps 1:1).
speed = 0.0
acceleration = true
# Primary button on the right (the trackpad follows).
left_handed = false
natural_scroll = false
# Pressing left and right together acts as the middle button.
middle_click_emulation = false
# Two clicks closer than this many ms are a double-click (150 … 1000), here and in GTK apps.
double_click_ms = 400
# Middle click pastes the last selected text; false turns that off, here and in GTK apps.
middle_click_paste = true

[hot_corners]
# Rest the pointer in a screen corner for a moment to trigger an action (any action from [bindings] below, like
# mission-control, app-expose, show-desktop, launchpad, notification-center, lock, display-off), or "none".
top_left = "none"
top_right = "none"
bottom_left = "none"
bottom_right = "none"

[display]
# The GPU that draws the desktop, e.g. "/dev/dri/card1"; empty = the one the computer booted with. Applies at next login.
gpu = ""
# How big everything is drawn: 1.0 = 100%, 1.25, 1.5, 2.0 …, or 0 = picked from the display's pixel density
# (about 128 px per inch per 100% on a laptop's own panel, 110 on a monitor). Applies at once to every display.
scale = 0.0

# One display's own settings, by connector name (System Settings ▸ Displays writes these; they apply at once).
# A display without an entry lights at its preferred resolution and highest refresh rate, at the scale above,
# right of the others. Every key but `name` may be left out. Each set of displays keeps its own entries (by make,
# model and serial, in ~/.local/state/noobsbot-desktop/display-layouts.json): plugging that set in again puts them back.
#
# [[display.outputs]]
# name = "eDP-1"          # the connector: eDP-1 (a laptop's panel), HDMI-A-1, DP-2 …; "winit" when nested
# enabled = true          # false turns the display off (the last one on stays on)
# mode = "1920x1200"      # resolution; "" = the display's preferred one
# refresh = 60.0          # Hz; 0 = the highest that resolution offers
# scale = 1.25            # overrides [display] scale above; 0 = that one
# rotation = 0            # degrees clockwise: 0, 90, 180 or 270
# position = [0, 0]       # top-left corner in logical px; left out = right of the others
# primary = true          # the menu bar and dock go on this one (else the first display)

[windows]
# Hold this key and drag anywhere in a window to move it: "super" or "alt".
move_modifier = "super"
# Window edges stick to screen and window edges within 8 px (hold Ctrl to disable while dragging).
magnetic_edges = true
# Drag a window to a screen side for a half, a side's top or bottom for a quarter, the top for the whole screen.
# Dragging it away gives back its old size. Hold Ctrl to skip.
snapping = true
# Double-clicking a title bar: "zoom", "minimise" or "nothing".
double_click_title = "zoom"
# Spaces (virtual desktops): 0 = dynamic (start with one; + in Mission Control adds more), or a fixed count 2–16.
spaces = 0
# Advanced: "hover" gives the keyboard to the window under the pointer after a moment, without raising it;
# "click" (the default) needs a click.
focus = "click"
# Log Out / Restart / Shut Down reopen the running apps' windows at the next login (the alert's checkbox sets it).
reopen_at_login = true

[spaces]
# Each display has its own Spaces and switches them on its own (keys and swipes act on the display under the
# pointer); false: one set of Spaces every display switches together.
per_display = true

[clock]
# Time zone, like "Asia/Kathmandu"; empty = keep the system's. Changing it sets the system zone (may ask for your password).
timezone = ""
hour24 = false
weekday = true
date = true
seconds = false
# The calendar's first day: "auto" (the locale's, from LC_TIME), "sunday", "monday" or "saturday".
week_start = "auto"
# ISO week numbers in a narrow column at the left of the Notification Center calendar.
week_numbers = false

[menu_bar]
# Hide the menu bar until the pointer touches the top of the screen (or a menu is open); zoomed windows then use the
# full height.
auto_hide = false

[dock]
# Pinned apps, left to right: desktop-file names (kate), app ids or commands. Apps that aren't installed are
# skipped, so they appear in their place once installed. "launchpad" is the Launchpad icon, "app-drawer" the app
# drawer's, "screenshot" the screenshot toolbar (Spectacle, which needs its own compositor, opens it too). On first start an
# existing Plank dock is imported.
items = ["launchpad", "google-chrome", "com.microsoft.VSCode", "helium-browser", "dolphin", "kate", "screenshot", "kitty", "noobsbot"]
# Icon size in px; icons shrink (down to 32) when they don't fit the screen.
icon_size = 84
# Icons grow under the pointer, to this percentage of icon_size.
zoom = true
zoom_percent = 150
# Plank's hide modes; touch the bottom edge under the dock to show a hidden one. "intelligent": hide while a window
# of the focused app overlaps it; "auto": hide unless the pointer is on it; "dodge-maximized": hide while the focused
# window is maximised; "window-dodge": hide while any window overlaps it; "dodge-active": hide while the focused
# window overlaps it; "never": always shown, and windows keep clear of it.
hide = "intelligent"
# Milliseconds to wait before hiding, and before showing when the pointer calls it up.
hide_delay = 0
unhide_delay = 0
# No dragging icons in, out or around, and no Keep in Dock.
lock_items = false
# Show only pinned apps; show only the current Space's running apps and windows.
pinned_only = false
current_workspace_only = false
# The app's name over the hovered icon.
tooltips = true
# Clicking the focused app's icon: "toggle" minimises its windows, "cycle" goes to its next window.
# Shift- or Ctrl-click opens a new window.
click = "toggle"
# Middle-clicking an icon: "new" window, or "close" the app's windows.
middle = "new"
# Scrolling on an icon cycles its app's windows: "on", "reverse" or "off".
scroll = "on"
# Minimised windows go into their app's icon; false: thumbnail tiles at the dock's right end, after a separator.
minimise_into_icon = false
# How windows minimise: "scale" (shrink and slide) or "genie" (narrow into the dock, bottom first).
# Reduce motion makes either a crossfade.
minimise_effect = "scale"
# The Trash at the dock's right end, after a separator: click opens it, drop files on it to trash them.
show_trash = true
# The dock menu's Options ▸ Assign To, per app: "all" puts its windows on every Space; "<display>:<n>" opens its new
# windows on Space n of that display. E.g. assign = { "org.kde.kate" = "all", "kitty" = "DP-1:2" }
assign = {}

[idle]
# Seconds without input before the screen dims, turns off, and the computer sleeps; 0 = never.
# Videos and calls (apps holding idle-inhibit) keep all of it away.
dim = 120
# The screen turns off after screen_off on the power adapter, after screen_off_on_battery on battery.
screen_off = 300
screen_off_on_battery = 180
# The keyboard backlight goes off, back on at the next key or move (at the latest when the screen dims).
keyboard_backlight_off = 30
sleep_on_battery = 900
sleep_on_ac = 0
# Lock the screen when it turns off. It always locks before sleeping.
lock = true
# Seconds after the screen turns off before it locks (0 = at once); input before then wakes it unlocked.
lock_delay = 0
# A line on the lock screen, under the clock ("If found, call …").
lock_message = ""

[battery]
# The percentage beside the menu bar's battery symbol.
show_percentage = true
# Slightly dim the display on battery: unplugging lowers the brightness a step, plugging in gives it back.
dim_on_battery = true

[sound]
# The alert sound, by its name in the freedesktop sound theme (/usr/share/sounds/freedesktop/stereo): "bell",
# "dialog-warning", "message" … Apps ringing the bell play it (see `bell` under [accessibility]).
alert = "bell"
# Play user interface sound effects: taking a screenshot, emptying the Trash, the volume keys.
ui_sounds = true

[privacy]
# Programs (by path) allowed to record the screen through wlr-screencopy (grim, wf-recorder, OBS), and those denied.
# The first time a program asks, an alert asks you and the answer is saved here. The screen-sharing portal,
# xwayland-satellite and anything started with `noobsbot-desktop --trusted <command>` never ask; sandboxed (Flatpak)
# apps never see screen recording at all.
screen_recording = []
screen_recording_denied = []

[weather]
# The Weather widget in Notification Center, from Open-Meteo (no account, no key). Off by default: while on, the
# forecast for this one place is fetched every 30 minutes; your location is never looked up from your IP.
enabled = false
# A city name, looked up once; empty = use latitude and longitude.
city = ""
latitude = 0.0
longitude = 0.0
# "celsius" or "fahrenheit".
units = "celsius"
[widgets]
# Widgets other apps show over D-Bus (org.noobsbot.Desktop.Widgets), by id. Notification Center shows them in this
# order, then any not listed anywhere; ids in `desktop` show on the desktop instead.
center = []
desktop = []
[calendar]
# Events for Notification Center's Up Next, the calendar's dots and reminders: .ics files, folders, or "dir/*.ics".
# Saved changes show at once. (CalDAV and Google calendars: later.)
files = ["~/.local/share/noobsbot-desktop/calendars/*.ics"]

[update]
# "stable", or "beta" to also get pre-releases (1.4.0-beta.2). Updates download in the background, are checked
# against the release signature, and install with "Restart to Update" (asks for the admin password).
channel = "stable"

[desktop]
# The files in your Desktop folder (XDG_DESKTOP_DIR, usually ~/Desktop) as icons on the wallpaper. Drag them to
# arrange; right-click for Open, Rename, Move to Trash and New Folder.
icons = true
# Mounted USB drives, SD cards and other disks as icons too, at the top right above the files. Double-click opens one;
# right-click for Open and Eject.
show_drives = true

[housekeeping]
# Once a day: items in the Trash longer than this many days are deleted for good, and recent-files entries older
# than this are forgotten (0 = never). Thumbnails unused for 90 days are removed too.
empty_trash_days = 30
recent_days = 30

[notifications]
# Do Not Disturb (the Control Center tile): banners stay quiet; Notification Center still collects them.
dnd = false
# Do Not Disturb turns on at dnd_from and off at dnd_until (whole hours, local; 22 → 7 runs across midnight).
dnd_scheduled = false
dnd_from = 22
dnd_until = 7
# Banners while a full-screen window has focus (off: they wait in Notification Center).
full_screen = false
# Show a notification's body in banners and Notification Center: "always", "unlocked" (not while locked) or "never".
previews = "always"

[notification_apps]
# Per app, by the name it sends: "banner" (goes after a few seconds), "alert" (stays until dismissed), "none" (only in
# Notification Center) or "off" (dropped). Apps not listed show banners. Or a table with switches as well, each on
# unless set: sound (a sound as it arrives), badge (the count on its dock icon), center (kept in Notification Center;
# off, it goes with its banner). System Settings ▸ Notifications sets these.
# "Firefox" = "alert"
# "Thunderbird" = { style = "banner", sound = false, badge = true, center = true }

[app_drawer]
# The app drawer (Super+A, or the "app-drawer" dock item): apps by category, search, Favorites and Recent.
# Press and release Super on its own to open it, like a classic start menu. Super+key shortcuts, Super+drag, holding
# Super for more than half a second, and Super with another modifier never count as a tap.
super_tap = true

[network]
# Proxy for the apps the desktop starts: "none", "manual" (the servers below) or "auto" (the PAC file below).
# Manual proxies reach apps as http_proxy, https_proxy, all_proxy (SOCKS) and no_proxy; both modes are also written
# to the GTK proxy settings. Apps already running keep what they had.
proxy = "none"
# host:port of each kind of proxy; empty = none.
proxy_http = ""
proxy_https = ""
proxy_socks = ""
# Hosts and networks that skip the proxy, comma separated, e.g. "localhost, 127.0.0.0/8, .lan".
proxy_bypass = ""
# The proxy auto-config file's URL, e.g. "http://wpad.lan/wpad.dat".
proxy_pac = ""

# Shortcuts. Each entry is merged over the defaults; set one to "none" to free the key. Keys match in any case and
# modifier order ("Ctrl+Super+x" is "Super+Ctrl+X"): yours replaces the default with the same keys, and of two of
# yours with the same keys the first in sorted order is kept (a warning is logged).
# Actions: terminal, quit, close, minimise, zoom, fullscreen, hide, hide-others, show-all, lock, sleep, display-off, restart, shut-down, log-out, cycle, quake (show/hide `noobsbot --quake`), "exec <command>", "default-app <MIME type or category>", "volume up|down|up-fine|down-fine", mute, mic-mute,
# "brightness up|down", "keyboard-backlight up|down|toggle", "touchpad toggle|on|off", "media play-pause|next|previous|stop|forward|rewind", eject, "space left|right|1…9", "move-to-space left|right|1…16",
# move-to-new-space, "move-to-display next|previous", "tile left|right|top|bottom|top-left|top-right|bottom-left|bottom-right",
# fill, center, keep-on-top, cycle-app-windows, "screen-zoom [in|out]",
# mission-control, app-expose, show-desktop, screenshot (the whole screen), screenshot-region, screenshot-window (the focused one), screen-record, screenshot-toolbar, emoji,
# app-drawer, "dock-app 1…9", "dock-app-new 1…9", on-screen-keyboard.
[bindings]
"Super+Return" = "terminal"
"Super+B" = "exec helium-browser"
"Super+E" = "exec dolphin"
"Super+Q" = "quit"
"Super+W" = "close"
"Super+M" = "minimise"
"Super+Ctrl+F" = "fullscreen"
"Super+H" = "hide"
"Super+Alt+H" = "hide-others"
# Hold Super and press Tab to switch apps (Shift+Tab steps back). Nested in another desktop, Super is Alt, and the
# host may keep Alt+Tab for itself: bind another key here, e.g. "Super+Ctrl+Tab" = "switcher".
"Super+Tab" = "switcher"
"Super+Alt+Escape" = "force-quit"
# Zoom ([accessibility] zoom_style): on/off, in, out.
"Super+Alt+8" = "screen-zoom"
"Super+Alt+equal" = "screen-zoom in"
"Super+Alt+minus" = "screen-zoom out"
"Super+Alt+F5" = "screen-reader"
"Super+Ctrl+Q" = "lock"
"Super+N" = "notification-center"
"Super+Space" = "spotlight"
# The app drawer; it also opens with a lone Super tap ([app_drawer] super_tap) and from an "app-drawer" dock item.
"Super+A" = "app-drawer"
# Next keyboard layout (E6.12); fcitx5 keeps its own switch key for its input methods.
"Super+Ctrl+Space" = "input-source"
# The emoji picker (E7.2): types the emoji into the focused text field, or copies it.
"Super+Ctrl+E" = "emoji"
"Super+period" = "emoji"
# Spaces (E5.1) and Mission Control (E5.2). Ctrl+arrows and Ctrl+1…9 stay with the apps; Super+Ctrl+1…9 go to a Space.
"Super+Left" = "space left"
"Super+Right" = "space right"
"Super+Ctrl+1" = "space 1"
"Super+Ctrl+2" = "space 2"
"Super+Ctrl+3" = "space 3"
"Super+Ctrl+4" = "space 4"
"Super+Ctrl+5" = "space 5"
"Super+Ctrl+6" = "space 6"
"Super+Ctrl+7" = "space 7"
"Super+Ctrl+8" = "space 8"
"Super+Ctrl+9" = "space 9"
# The n-th dock icon (E8.3): focus it, cycle its windows if it has focus, or open it. Hold Super to see the numbers.
# Super+Shift+n opens a new window; Super+Shift+3/4/5 stay screenshots.
"Super+1" = "dock-app 1"
"Super+2" = "dock-app 2"
"Super+3" = "dock-app 3"
"Super+4" = "dock-app 4"
"Super+5" = "dock-app 5"
"Super+6" = "dock-app 6"
"Super+7" = "dock-app 7"
"Super+8" = "dock-app 8"
"Super+9" = "dock-app 9"
"Super+Shift+1" = "dock-app-new 1"
"Super+Shift+2" = "dock-app-new 2"
"Super+Shift+6" = "dock-app-new 6"
"Super+Shift+7" = "dock-app-new 7"
"Super+Shift+8" = "dock-app-new 8"
"Super+Shift+9" = "dock-app-new 9"
"Super+Shift+Left" = "move-to-space left"
"Super+Shift+Right" = "move-to-space right"
# Tile the window to a half of the screen; dragging it away gives its old size back (E8.5).
"Super+Ctrl+Left" = "tile left"
"Super+Ctrl+Right" = "tile right"
"Super+Ctrl+Up" = "tile top"
"Super+Ctrl+Down" = "tile bottom"
# The focused app's next window.
"Super+grave" = "cycle-app-windows"
"Super+Up" = "mission-control"
"Super+Down" = "app-expose"
"Super+F11" = "show-desktop"
# Screenshots (E6.8), saved to ~/Pictures/Screenshots and copied to the clipboard.
"Super+Shift+3" = "screenshot"
"Super+Shift+4" = "screenshot-region"
"Super+Shift+5" = "screenshot-toolbar"
"Print" = "screenshot-toolbar"
"Shift+Print" = "screenshot-region"
# The focused window; Super+Shift+4 then Space picks one with the pointer.
"Alt+Print" = "screenshot-window"
# Starts or stops recording the whole screen into ~/Videos (needs wf-recorder).
"Super+Alt+5" = "screen-record"
"F12" = "quake"
# Launchpad also opens from its dock icon; F4 is free for apps unless you bind it.
# "F4" = "launchpad"
"XF86AudioRaiseVolume" = "volume up"
"XF86AudioLowerVolume" = "volume down"
# Quarter steps.
"Shift+Alt+XF86AudioRaiseVolume" = "volume up-fine"
"Shift+Alt+XF86AudioLowerVolume" = "volume down-fine"
"XF86AudioMute" = "mute"
"XF86AudioMicMute" = "mic-mute"
"XF86MonBrightnessUp" = "brightness up"
"XF86MonBrightnessDown" = "brightness down"
"XF86KbdBrightnessUp" = "keyboard-backlight up"
"XF86KbdBrightnessDown" = "keyboard-backlight down"
"XF86KbdLightOnOff" = "keyboard-backlight toggle"
# The trackpad on or off until this file is next saved ([touchpad] enabled keeps it).
"XF86TouchpadToggle" = "touchpad toggle"
"XF86TouchpadOn" = "touchpad on"
"XF86TouchpadOff" = "touchpad off"
"XF86AudioPlay" = "media play-pause"
"XF86AudioPause" = "media play-pause"
"XF86AudioNext" = "media next"
"XF86AudioPrev" = "media previous"
"XF86AudioStop" = "media stop"
# Ten seconds on or back.
"XF86AudioForward" = "media forward"
"XF86AudioRewind" = "media rewind"
# Ejects the last mounted USB drive or disc.
"XF86Eject" = "eject"
# Launch keys open the default app for a MIME type (xdg-mime), or the first app in a .desktop category.
"XF86WWW" = "default-app x-scheme-handler/https"
"XF86Mail" = "default-app x-scheme-handler/mailto"
"XF86Explorer" = "default-app inode/directory"
"XF86Calculator" = "default-app Calculator"
"XF86Search" = "spotlight"
# The display key opens System Settings › Displays (arrangement, which screens are on).
"XF86Display" = "exec noobsbot-desktop-settings --page displays"
# The power button asks before shutting down (the system's own power-key action is held off while the desktop runs).
"XF86PowerOff" = "shut-down"
"XF86Sleep" = "sleep"
"Super+Shift+Q" = "log-out"

# Window rules, applied when a window appears and again when its title changes.
# Match on app_id (exact) and/or title (a regular expression, searched anywhere in the title).
# Every matching rule applies in order; a later rule wins where two set the same thing.
# Writing any [[rules]] here replaces this default list.
#
# Keys:
#   space = "all" | 1, 2, …           open on that Space
#   float_above = true                always above normal windows
#   size = [800, "40%"]               logical px or a percentage of the screen
#   position = [0, 0]                 top-left corner, px or percentage
#   fullscreen = true
#   decorations = false               no title bar
#   layer = "overlay"                 above fullscreen apps ("normal" to undo)
#   opacity = 0.9
#
# The quake terminal (the "quake" binding): full width, 40% high, at the top, above fullscreen apps.
# noobsbot gives it no app_id of its own, so the desktop calls the window it started "noobsbot-quake".
[[rules]]
app_id = "noobsbot-quake"
space = "all"
size = ["100%", "40%"]
position = [0, 0]
decorations = false
layer = "overlay"

# The browser's (Helium, any Chromium) picture-in-picture window stays on top.
[[rules]]
title = "^Picture in picture$"
float_above = true
