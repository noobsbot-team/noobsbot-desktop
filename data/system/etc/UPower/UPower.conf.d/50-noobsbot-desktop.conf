# Battery (plan.md E6.5): UPower alone sleeps at 5%; Noobsbot Desktop only shows the 20% and 10% notifications.
[UPower]
# UPower wants low > critical > action, so critical moves up to the 10% notification.
PercentageCritical=10.0
PercentageAction=5.0
CriticalPowerAction=Suspend
# Suspend counts as "risky" since UPower 1.90 (a suspended laptop can still run flat); without this it hibernates or powers off.
AllowRiskyCriticalPowerAction=true
