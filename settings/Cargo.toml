[package]
name = "noobsbot-desktop-settings"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Noobsbot Desktop System Settings"
repository = "https://github.com/noobsbot-team/noobsbot-desktop"
publish = false

[dependencies]
# Software rendering only: a settings window needs no GPU, and it starts faster without wgpu (E7.1, Open-2).
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "crisp", "wayland", "x11", "svg", "thread-pool", "advanced", "canvas", "image-without-codecs"] }
toml_edit = "0.25.17"
# The hour, for Appearance ▸ Auto (same as the desktop).
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Wallpaper gallery thumbnails, decoded with the desktop's own decoders.
png = "0.18.1"
zune-jpeg = "0.5.15"
zbus = "5.19.0"
futures-lite = "2.6.1"
notify = "8.2.0"
# Sound's `pactl subscribe` dies with the app (PR_SET_PDEATHSIG), as the desktop's `pw-dump` does.
libc = "0.2.191"
# displays.json, which the desktop writes (src/display_info.rs, shared).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
