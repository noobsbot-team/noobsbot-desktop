[package]
name = "noobsbot-desktop"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Noobsbot Desktop: a macOS-style Wayland desktop environment"
repository = "https://github.com/anil0403/noobsbot-desktop"

[workspace]
# System Settings (E7.1) is the one separate program.
members = ["settings"]

# The privileged Software Update helper (E6.13), run through pkexec.
[[bin]]
name = "noobsbot-desktop-update"
path = "src/bin/update-helper.rs"

[dependencies]
smithay = { version = "=0.7.0", default-features = false, features = ["backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "backend_winit", "desktop", "renderer_gl", "renderer_multi", "wayland_frontend"] }
notify = "8.2.0"
regex-lite = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cosmic-text = "0.19.0"
png = "0.18.1"
zune-jpeg = "0.5.15"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
zbus = "5.19.0"
futures-lite = "2.6.1"
async-channel = "2.5.0"
libc = "0.2.191"
semver = "1.0.28"
resvg ={ version = "0.48.1", default-features = false, features = ["raster-images"] }
minisign-verify = "0.3.0"
sha2 = "0.10.9"

[profile.release]
lto = "thin"
strip = true
panic = "abort"

[profile.dev]
panic = "abort"

# wayland-backend 0.3.17 panics on a wl_registry.bind with a null interface string (found by scripts/fuzz-client.py);
# vendored with a one-branch fix (see the noobsbot-desktop patch comment) until upstream fixes it.
[patch.crates-io]
wayland-backend = { path = "vendor/wayland-backend" }
