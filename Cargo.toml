[package]
name = "noobsbot-desktop"
version = "1.0.0-alpha.1"
edition = "2024"
license = "MIT"
description = "Noobsbot Desktop: a macOS-style Wayland desktop environment"
repository = "https://github.com/anil0403/noobsbot-desktop"

[dependencies]
smithay = { version = "=0.7.0", default-features = false, features = ["backend_winit", "desktop", "renderer_gl", "wayland_frontend"] }
notify = "8.2.0"
regex-lite = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
panic = "abort"

[profile.dev]
panic = "abort"
