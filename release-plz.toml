# Semantic Versioning 2.0.0 (E6.13; the public API is declared in README ▸ Updates): feat → minor, fix/perf → patch,
# `!` or BREAKING CHANGE → major from 1.0.0 on, minor while 0.y.z. The version lives only in Cargo.toml; tags
# (`v1.3.0`) and GitHub Releases are made by release-plz, never by hand, and a released version is never changed.
[workspace]
# Not on crates.io; releases are GitHub Releases with a signed tarball (release.yml).
publish = false
# So the last version comes from our `v…` tags, not crates.io (else every run thinks 0.1.0 is unreleased).
git_only = true
git_tag_name = "v{{ version }}"
git_release_enable = true
# Pre-releases (README ▸ Updates): while the version is one (`1.0.0-beta.1`), release-plz bumps only its number
# (beta.1 → beta.2); the next stage (alpha → beta → rc → the release, `1.0.0`) is set by hand in the release PR.
# A pre-release becomes a GitHub pre-release, seen by the Beta channel, and by Stable only while no stable release exists.
git_release_type = "auto"
changelog_update = true
# While 0.y.z, `feat:` bumps the minor too (not the patch), as it will from 1.0.0 on.
features_always_increment_minor = true
semver_check = false
# Tag and release only when the merged commit comes from a release PR, never on an ordinary push.
release_always = false

# System Settings ships inside the desktop's tarball and shows its version; it is never released on its own.
[[package]]
name = "noobsbot-desktop-settings"
release = false
