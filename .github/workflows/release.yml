# Builds, checks, signs and publishes the release tarball of a `v*` tag (E6.13). It starts on the tag push itself:
# version.yml pushes each version's tag with its deploy key (a GITHUB_TOKEN push would start no workflow), and a tag
# pushed by hand starts it too. The version is set from the tag before building, since a beta is only a tag.
# Publishing makes a release "latest"; a beta stays a pre-release, never "latest".
#
# One tarball per CPU (x86_64, aarch64) for Arch and Debian: each is built on Debian 13, the oldest system supported
# (glibc 2.41; Arch's is newer, and a program built against an older glibc runs on a newer one). Before it is signed,
# it must start on both; aarch64 only on Debian, since the archlinux image is x86_64 only. One SHA256SUMS lists them
# all: the updater and install.sh each take their own CPU's line.
#
# Repository secrets (scripts/setup-release-signing.sh sets them): MINISIGN_SECRET_KEY = the whole minisign secret key
# file; MINISIGN_PASSWORD = its password (leave unset for a key made with `minisign -G -W`). The matching public key is
# compiled into the updater. Only the publish job, which signs, runs in the `release` environment: give it required
# reviewers (Settings ▸ Environments) to approve every signing, each beta's too.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: debian:13
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git zstd build-essential pkgconf clang rustup \
            libxkbcommon-dev libseat-dev libinput-dev libudev-dev libsystemd-dev libdrm-dev libgbm-dev libegl-dev \
            libgles-dev libdisplay-info-dev libpam0g-dev libwayland-dev libxcb1-dev libxcb-cursor-dev
          # Debian's own Rust is too old for the dependencies.
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/checkout@v4
      # A beta's tag is on a commit that still has the last release's version (a run on a branch stops here).
      - run: .github/set-version.sh "$TAG"
      - name: Build
        run: |
          export NOOBSBOT_COMMIT="$(git -c safe.directory='*' rev-parse --short HEAD)"
          export NOOBSBOT_DATE="$(git -c safe.directory='*' log -1 --format=%cs)"
          cargo build --workspace --release --locked
      - name: Build xwayland-satellite
        run: |
          # X11 apps (E6.9): our patched build, which the desktop starts from beside itself.
          sh scripts/build-xwayland-satellite.sh "$RUNNER_TEMP/xws"
      - name: Package
        run: |
          version="${TAG#v}"
          name="noobsbot-desktop-$version-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/noobsbot-desktop target/release/noobsbot-desktop-settings target/release/noobsbot-desktop-update \
            target/release/noobsbot-desktop-watchdog target/release/noobsbot-desktop-widget-system \
            "$RUNNER_TEMP/xws/target/release/xwayland-satellite" LICENSE README.md "dist/$name/"
          cp -r data "dist/$name/"
          cd dist
          tar --zstd -cf "$name.tar.zst" "$name"
          # Hashed where it was built; publish checks the download against it before joining them into SHA256SUMS.
          sha256sum "$name.tar.zst" > "SHA256SUMS-${{ matrix.arch }}"
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/

  # The tarball must load on both systems: every library found, none too old (`--version` only runs once they load).
  smoke:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, system: "archlinux:latest" }
          - { arch: x86_64, runner: ubuntu-latest, system: "debian:13" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, system: "debian:13" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.system }}
    steps:
      - name: Runtime libraries
        run: |
          if command -v pacman > /dev/null; then
            pacman -Syu --noconfirm --needed zstd libxkbcommon seatd libinput systemd-libs pam mesa libxcb xcb-util-cursor
          else
            apt-get update
            apt-get install -y --no-install-recommends zstd libinput10 libxkbcommon0 libseat1 libpam0g libgbm1 libudev1 \
              libegl1 libgles2 libxcb1 libxcb-cursor0
          fi
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist
      - name: Load test
        run: |
          mkdir x
          tar --zstd -xf dist/*.tar.zst -C x --strip-components=1
          for bin in noobsbot-desktop noobsbot-desktop-settings noobsbot-desktop-update noobsbot-desktop-watchdog noobsbot-desktop-widget-system xwayland-satellite; do
            if ldd "x/$bin" | grep 'not found'; then echo "$bin: missing libraries on ${{ matrix.system }}"; exit 1; fi
          done
          x/noobsbot-desktop --version

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          # Never publish unsigned: the updater refuses anything without a valid signature.
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY is not set"; exit 1; }
          sudo apt-get update
          sudo apt-get install -y minisign
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          cd dist
          # Every CPU's tarball, or none: a release without one would leave that CPU on the old version. The CPUs are
          # the build matrix's.
          for arch in x86_64 aarch64; do
            test -f "noobsbot-desktop-${TAG#v}-$arch.tar.zst" || { ls; echo "no $arch tarball for $TAG"; exit 1; }
          done
          cat SHA256SUMS-* | sha256sum -c --strict
          cat SHA256SUMS-* > SHA256SUMS
          rm SHA256SUMS-*
          for file in *.tar.zst SHA256SUMS; do
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$file" -t "noobsbot-desktop $TAG"
          done
          rm -f "$key"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          # version.yml makes the draft release seconds after its tag push, long before this; a hand-pushed tag has none.
          case "$TAG" in *-*) pre=--prerelease latest=false ;; *) pre= latest=true ;; esac
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --draft $pre
          gh release upload "$TAG" --clobber *.tar.zst SHA256SUMS *.minisig
          # Published only once its files are there, so the updater never sees it without them.
          gh release edit "$TAG" --draft=false --latest=$latest
