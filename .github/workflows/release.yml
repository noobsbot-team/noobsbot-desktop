# Builds, signs and attaches the release tarball (E6.13). Called by release-plz.yml right after release-plz tags a
# version (tags pushed with the default GITHUB_TOKEN start no workflows, so the call is how it runs), or on a `v*` tag
# pushed with any other token.
#
# Secrets (repository settings): MINISIGN_SECRET_KEY = the whole minisign secret key file; MINISIGN_PASSWORD = its
# password (leave unset for a key made with `minisign -G -W`). The matching public key is compiled into the updater.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      MINISIGN_SECRET_KEY:
        required: true
      MINISIGN_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed rust gcc pkgconf libxkbcommon git zstd minisign github-cli
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build
        run: |
          export NOOBSBOT_COMMIT="$(git -c safe.directory='*' rev-parse --short HEAD)"
          export NOOBSBOT_DATE="$(git -c safe.directory='*' log -1 --format=%cs)"
          cargo build --workspace --release --locked
      - name: Package
        run: |
          version="${TAG#v}"
          name="noobsbot-desktop-$version-x86_64"
          mkdir -p "dist/$name"
          cp target/release/noobsbot-desktop target/release/noobsbot-desktop-settings LICENSE README.md "dist/$name/"
          cp -r data "dist/$name/"
          cd dist
          tar --zstd -cf "$name.tar.zst" "$name"
          sha256sum "$name.tar.zst" > SHA256SUMS
          echo "ASSETS=$name.tar.zst SHA256SUMS" >> "$GITHUB_ENV"
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          # Never publish unsigned: the updater refuses anything without a valid signature.
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY is not set"; exit 1; }
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          cd dist
          for file in $ASSETS; do
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$file" -t "noobsbot-desktop $TAG"
          done
          rm -f "$key"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory '*'
          cd dist
          # release-plz has already made the release with the changelog as notes; a hand-pushed tag has none yet.
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes $pre
          gh release upload "$TAG" --clobber $ASSETS *.minisig
