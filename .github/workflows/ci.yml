# fmt, clippy, tests and the Debian release build on every pull request (E6.13). The ruleset on main takes only pull requests
# that passed `check` and `debian` and are up to date with main, so what they tested is what lands: main itself needs
# no second run. A push to main runs them only when Cargo.lock changes (each release's commit does), to save the build
# caches every pull request starts from: a pull request's own cache is only its own, so pull requests only restore.
# The caches hold the dependencies, not our own crates (rust-cache), so they restore fast.
name: CI

on:
  push:
    branches: [main]
    paths: ['Cargo.lock']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs, trail notes and agent wiring only: nothing to build or test. The checks are then skipped, which counts as
  # passed; a path filter on the trigger would leave the ruleset waiting for checks that never run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [[ $GITHUB_EVENT_NAME != pull_request ]]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE...$HEAD" | grep -Ev '\.md$|^\.trail/|^\.claude/' >/dev/null &&
            echo code=true >> "$GITHUB_OUTPUT" || echo code=false >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Arch, like the users' machines: same glibc, libxkbcommon and fonts.
    container: archlinux:latest
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed rust gcc pkgconf libxkbcommon seatd libinput systemd-libs libdrm mesa libdisplay-info inter-font git
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # No release build here: the release is built on Debian (release.yml), and the debian job below builds it.
      - run: cargo test --workspace --locked

  # The release is built on Debian 13 (release.yml), so the tests run there too.
  debian:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential pkgconf clang rustup \
            libxkbcommon-dev libseat-dev libinput-dev libudev-dev libsystemd-dev libdrm-dev libgbm-dev libegl-dev \
            libgles-dev libdisplay-info-dev libpam0g-dev libwayland-dev libxcb1-dev libxcb-cursor-dev fonts-inter libkf6config-bin \
            dbus-daemon
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: sh scripts/test-install.sh
